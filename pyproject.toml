[project]
name = "neurosymbolic-ai"
version = "0.1.0"
description = "Prototipo didattico di valutazione prestiti con rete neurale e regole simboliche"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "scikit-learn>=1.3.2,<1.4",
    "durable-rules==2.0.28",
]

[project.scripts]
neurosymbolic-ai = "neurosymbolic_ai:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", ".python-version", "uv.lock", "pyproject"]

